# Trunk build for the Fleet Cockpit WASM bundle.
#
# `trunk` is NOT installed by default — see README "Prerequisites".
# Install with: cargo install --locked trunk
#
# The emitted bundle is copied into apps/web/public/wasm by scripts/build-wasm.sh
# so the Astro static build can serve it without an extra hosting surface.
[build]
target = "index.html"
dist = "dist"
release = false

[watch]
ignore = ["dist"]

[serve]
port = 8081
open = false
